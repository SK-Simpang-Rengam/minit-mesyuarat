<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Minit SK Simpang Rengam</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

    <style>
        :root { 
            --primary-color: #1e3a8a; 
        }
        
        body { 
            background-color: #f4f7fa; 
            padding: 20px; 
            font-family: 'Segoe UI', sans-serif; 
        }
        
        .form-container { 
            background: white; 
            padding: 30px; 
            border-radius: 15px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); 
            max-width: 850px; 
            margin: 0 auto; 
        }
        
        /* Gaya Pengepala Borang - Diperbaiki menggunakan Flexbox */
        .form-header { 
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px; /* Jarak selamat antara logo dan teks tajuk */
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 3px double var(--primary-color);
        }

        .form-header img {
            width: 80px; /* Saiz ideal logo sekolah */
            height: auto;
            flex-shrink: 0; /* Mengelakkan imej terpenyet pada skrin telefon */
        }

        .form-title-area {
            text-align: left;
        }
        
        /* Pengurusan Kehadiran Guru */
        .kehadiran-box { 
            border: 1px solid #dbdbdb; 
            border-radius: 4px; 
            padding: 10px; 
            min-height: 60px; 
            background: #fff; 
            margin-bottom: 10px; 
            display: flex; 
            flex-wrap: wrap; 
            gap: 5px; 
        }
        
        .teacher-tag { 
            margin: 2px; 
        }

        /* Kotak Agenda Dinamik */
        .agenda-item { 
            background: #f9fafb; 
            border: 1px solid #e5e7eb; 
            padding: 15px; 
            border-radius: 8px; 
            margin-bottom: 15px; 
            position: relative; 
        }
        
        .btn-buang-agenda { 
            position: absolute; 
            top: 10px; 
            right: 10px; 
        }
    </style>
</head>
<body>

    <div class="form-container">
        <div class="form-header">
            <img src="logo_sksr.png" id="logoSekolah" alt="Logo SK Simpang Rengam">
            <div class="form-title-area">
                <h1 class="title is-4 mb-1" style="color: var(--primary-color);">SISTEM E-MINIT MESYUARAT</h1>
                <p class="subtitle is-6 has-text-grey mb-0">SK Simpang Rengam</p>
            </div>
        </div>

        <form id="minitForm">
            <div class="columns">
                <div class="column is-8">
                    <div class="field">
                        <label class="label is-small">Tajuk / Nama Mesyuarat</label>
                        <div class="control">
                            <input class="input is-small" id="tajukMesyuarat" placeholder="Contoh: Mesyuarat Jawatankuasa Kurikulum Bil 1/2026" required>
                        </div>
                    </div>
                </div>
                <div class="column is-4">
                    <div class="field">
                        <label class="label is-small">Rujukan Fail</label>
                        <div class="control">
                            <input class="input is-small" id="rujukanFail" placeholder="Contoh: SKSR.600-3/2/1(1)" required>
                        </div>
                    </div>
                </div>
            </div>

            <div class="columns">
                <div class="column is-3">
                    <div class="field">
                        <label class="label is-small">Tarikh</label>
                        <div class="control">
                            <input class="input is-small" type="date" id="tarikhMesyuarat" required>
                        </div>
                    </div>
                </div>
                <div class="column is-3">
                    <div class="field">
                        <label class="label is-small">Masa</label>
                        <div class="control">
                            <input class="input is-small" type="text" id="masaMesyuarat" placeholder="Contoh: 2:00 Petang" required>
                        </div>
                    </div>
                </div>
                <div class="column is-3">
                    <div class="field">
                        <label class="label is-small">Tempat</label>
                        <div class="control">
                            <input class="input is-small" type="text" id="tempatMesyuarat" placeholder="Contoh: Bilik Mesyuarat Al-Farabi" required>
                        </div>
                    </div>
                </div>
                <div class="column is-3">
                    <div class="field">
                        <label class="label is-small">Kategori / Unit Anjuran</label>
                        <div class="control">
                            <div class="select is-small is-fullwidth">
                                <select id="kategoriUnit">
                                    <option value="KURIKULUM">KURIKULUM</option>
                                    <option value="HAL EHWAL MURID">HAL EHWAL MURID (HEM)</option>
                                    <option value="KOKURIKULUM">KOKURIKULUM</option>
                                    <option value="PENTADBIRAN">PENTADBIRAN</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <hr style="margin: 15px 0; background-color: #eee;">

            <div class="columns">
                <div class="column is-6">
                    <div class="field">
                        <label class="label is-small">Nama Pengerusi Mesyuarat</label>
                        <div class="control">
                            <input class="input is-small" id="pengerusiMesyuarat" placeholder="Masukkan nama pengerusi..." required>
                        </div>
                    </div>
                </div>
                <div class="column is-6">
                    <div class="field">
                        <label class="label is-small">Nama Setiausaha / Pencatat Minit</label>
                        <div class="control">
                            <input class="input is-small" id="setiausahaMesyuarat" placeholder="Masukkan nama pencatat..." required>
                        </div>
                    </div>
                </div>
            </div>

            <div class="field">
                <label class="label is-small">Kehadiran Guru / Ahli Mesyuarat (<span id="jumlahHadir">0</span> Orang Terpilih)</label>
                <div class="columns mb-1">
                    <div class="column is-10">
                        <div class="control">
                            <div class="select is-small is-fullwidth">
                                <select id="pilihGuru">
                                    <option value="">-- Sila Pilih Nama Guru Untuk Ditambah --</option>
                                    <option value="MOHD RAFWAN BIN MILATUS SAMSUL">MOHD RAFWAN BIN MILATUS SAMSUL</option>
                                    <option value="JEHAN ADIBA BINTI AHMAD TAHA">JEHAN ADIBA BINTI AHMAD TAHA</option>
                                    <option value="AZIZAH BINTI SHARIFF">AZIZAH BINTI SHARIFF</option>
                                    <option value="AHMAD SYAHMI BIN NURDIN">AHMAD SYAHMI BIN NURDIN</option>
                                    <option value="FAIZAH BINTI ABDUL RAHMAN">FAIZAH BINTI ABDUL RAHMAN</option>
                                    <option value="KHAIRUL ANUAR BIN ZAINAL">KHAIRUL ANUAR BIN ZAINAL</option>
                                    <option value="NORMAH BINTI SULAIMAN">NORMAH BINTI SULAIMAN</option>
                                    <option value="SITI AMINAH BINTI BAKAR">SITI AMINAH BINTI BAKAR</option>
                                    <option value="ZULKIFLI BIN MAHMUD">ZULKIFLI BIN MAHMUD</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="column is-2">
                        <button type="button" class="button is-small is-info is-fullwidth" onclick="tambahGuruTerpilih()">
                            <span class="icon"><i class="fas fa-plus"></i></span>
                            <span>Tambah</span>
                        </button>
                    </div>
                </div>
                <div class="kehadiran-box" id="kotakSenaraiHadir">
                    </div>
            </div>

            <div class="field">
                <label class="label is-small">Ahli Tidak Hadir (Sebab)</label>
                <div class="control">
                    <textarea class="textarea is-small" id="tidakHadirMesyuarat" rows="2" placeholder="Contoh: 1. Guru A (Sakit), 2. Guru B (Kursus) - Jika tiada, tulis: Tiada"></textarea>
                </div>
            </div>

            <hr style="margin: 15px 0; background-color: #eee;">

            <div class="field">
                <label class="label is-small">1. Perutusan / Ucapan Alu-Aluan Pengerusi</label>
                <div class="control">
                    <textarea class="textarea is-small" id="perutusanPengerusi" rows="4" placeholder="Masukkan intipati ucapan pembukaan oleh pengerusi mesyuarat..." required></textarea>
                </div>
            </div>

            <div class="field">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                    <label class="label is-small mb-0">Agenda / Isu / Perkara Seterusnya (Format KPM)</label>
                    <button type="button" class="button is-small is-success" onclick="tambahKotakAgendaBaharu()">
                        <span class="icon"><i class="fas fa-plus-circle"></i></span>
                        <span>Tambah Agenda Baharu</span>
                    </button>
                </div>
                
                <div id="agendaContainer">
                    <div class="agenda-item" data-index="0">
                        <div class="field">
                            <label class="label is-small">Tajuk Isu / Perkara / Agenda</label>
                            <input class="input is-small agenda-tajuk" placeholder="Contoh: Analisis Pencapaian Akademik Konten PIT1 2026" required>
                        </div>
                        <div class="columns">
                            <div class="column is-8">
                                <label class="label is-small">Perincian Isu / Kandungan Agenda</label>
                                <textarea class="textarea is-small agenda-isi" rows="3" placeholder="Nyatakan perkara yang dibincangkan serta keputusan mesyuarat..." required></textarea>
                            </div>
                            <div class="column is-4">
                                <label class="label is-small">Tindakan / Makluman Kepada</label>
                                <textarea class="textarea is-small agenda-tindakan" rows="3" placeholder="Contoh: Semua Guru / KP Mata Pelajaran" required></textarea>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="field is-grouped is-grouped-right" style="margin-top: 30px;">
                <div class="control">
                    <button type="submit" class="button is-link" style="background-color: var(--primary-color);">
                        <span class="icon"><i class="fas fa-file-pdf"></i></span>
                        <span>Simpan & Jana Dokumen PDF KPM</span>
                    </button>
                </div>
            </div>
        </form>
    </div>

    <script>
        let senaraiGuruDipilih = [];
        let counterAgenda = 1;

        // Fungsi Tambah Guru Terpilih Ke Dalam Senarai Kehadiran
        function tambahGuruTerpilih() {
            const selectElement = document.getElementById('pilihGuru');
            const namaGuru = selectElement.value;

            if (!namaGuru) return;

            if (senaraiGuruDipilih.includes(namaGuru)) {
                alert("Nama guru ini sudah tersenarai dalam daftar kehadiran.");
                return;
            }

            senaraiGuruDipilih.push(namaGuru);
            selectElement.value = ""; // Reset dropdown pilihan
            renderTags();
        }

        // Fungsi Padam Guru Daripada Senarai Kehadiran
        function buangNamaGuru(nama) {
            senaraiGuruDipilih = senaraiGuruDipilih.filter(g => g !== nama);
            renderTags();
        }

        // Fungsi Kemas Kini Paparan Tag Nama Guru & Kaunter Jumlah Hadir
        function renderTags() {
            const container = document.getElementById('kotakSenaraiHadir');
            container.innerHTML = "";
            
            senaraiGuruDipilih.forEach(guru => {
                const tagHTML = `
                    <span class="tag is-info is-light teacher-tag">
                        ${guru}
                        <button type="button" class="delete is-small" onclick="buangNamaGuru('${guru}')"></button>
                    </span>
                `;
                container.insertAdjacentHTML('beforeend', tagHTML);
            });

            document.getElementById('jumlahHadir').innerText = senaraiGuruDipilih.length;
        }

        // Fungsi Tambah Kotak Agenda Dinamik Secara Berterusan
        function tambahKotakAgendaBaharu() {
            const container = document.getElementById('agendaContainer');
            const itemHTML = `
                <div class="agenda-item" data-index="${counterAgenda}">
                    <button type="button" class="button is-danger is-small btn-buang-agenda" onclick="buangKotakAgenda(this)">
                        <span class="icon"><i class="fas fa-trash-alt"></i></span>
                    </button>
                    <div class="field">
                        <label class="label is-small">Tajuk Isu / Perkara / Agenda</label>
                        <input class="input is-small agenda-tajuk" placeholder="Nyatakan agenda atau perkara berbangkit..." required>
                    </div>
                    <div class="columns">
                        <div class="column is-8">
                            <label class="label is-small">Perincian Isu / Kandungan Agenda</label>
                            <textarea class="textarea is-small agenda-isi" rows="3" placeholder="Nyatakan keputusan perbincangan isu..." required></textarea>
                        </div>
                        <div class="column is-4">
                            <label class="label is-small">Tindakan / Makluman Kepada</label>
                            <textarea class="textarea is-small agenda-tindakan" rows="3" placeholder="Contoh: Makluman Semua Ahli" required></textarea>
                        </div>
                    </div>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', itemHTML);
            counterAgenda++;
        }

        // Fungsi Buang Kotak Agenda Tertentu
        function buangKotakAgenda(buttonElement) {
            const agendaBox = buttonElement.closest('.agenda-item');
            agendaBox.remove();
        }

        // PENGENDALIAN SUBMIT BORANG & PROSES GENERATE PDF MULTI-PAGE
        document.getElementById('minitForm').addEventListener('submit', function(e) {
            e.preventDefault();

            if (senaraiGuruDipilih.length === 0) {
                alert("Sila pilih dan tambah sekurang-kurangnya seorang ahli mesyuarat yang hadir!");
                return;
            }

            // Membina Objek Payload Data Borang
            const agendaElements = document.querySelectorAll('.agenda-item');
            const senaraiAgendaData = [];

            agendaElements.forEach(item => {
                senaraiAgendaData.push({
                    sub_tajuk: item.querySelector('.agenda-tajuk').value,
                    sub_isi: item.querySelector('.agenda-isi').value,
                    sub_tindakan: item.querySelector('.agenda-tindakan').value
                });
            });

            const payload = {
                tajuk: document.getElementById('tajukMesyuarat').value,
                rujukan: document.getElementById('rujukanFail').value,
                tarikh: document.getElementById('tarikhMesyuarat').value,
                masa: document.getElementById('masaMesyuarat').value,
                tempat: document.getElementById('tempatMesyuarat').value,
                kategori: document.getElementById('kategoriUnit').value,
                pengerusi: document.getElementById('pengerusiMesyuarat').value,
                setiausaha: document.getElementById('setiausahaMesyuarat').value,
                tidak_hadir: document.getElementById('tidakHadirMesyuarat').value || "Tiada",
                kehadiran: senaraiGuruDipilih,
                senarai_agenda: senaraiAgendaData
            };

            // =================================================================
            // PROSES JANA PDF MENGGUNAKAN ELEMEN LOGO RASMI (DIKEMAS KINI)
            // =================================================================
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('p', 'pt', 'a4');

            let startTableY = 165; // Ruang keselamatan bahagian atas (Header KPM)

            // Mengambil elemen gambar logo sekolah secara terus dari struktur DOM HTML
            const logoImg = document.getElementById('logoSekolah');
            if (logoImg) {
                try {
                    // Menyuntik imej lokal ke PDF (Tengah Atas: X=262.5, Y=20, Lebar=70, Tinggi=70)
                    doc.addImage(logoImg, 'PNG', 262.5, 20, 70, 70);
                } catch(err) {
                    console.error("Gagal menyuntik imej logo ke dalam fail PDF:", err);
                }
            }

            // Tetapan Teks Tajuk Surat Minit Mesyuarat Rasmi
            doc.setFont("Helvetica", "bold");
            doc.setFontSize(13);
            doc.text("MINIT MESYUARAT SESI PERSEKOLAHAN 2026", 297, startTableY - 50, { align: "center" });
            doc.text("SK SIMPANG RENGAM", 297, startTableY - 32, { align: "center" });

            // Pemformatan Senarai Nama Kehadiran Secara Berbaris (Numbered List)
            let teksKehadiranDiformat = "";
            payload.kehadiran.forEach((g, idx) => { teksKehadiranDiformat += `${idx + 1}. ${g}\n`; });
            
            // Format Tarikh Dari YYYY-MM-DD Kepada DD/MM/YYYY
            const tarikhDiformat = payload.tarikh.split('-').reverse().join('/');

            // Pembuatan Jadual Maklumat Asas Minit (Table 1)
            doc.autoTable({
                startY: startTableY,
                theme: 'plain',
                styles: { borderHexColor: '#000000', borderWidth: 1.5, lineColor: 0, cellPadding: 6, fontSize: 10, textColor: 0 },
                columnStyles: { 
                    0: { fontStyle: 'bold', halign: 'center', width: 90 }, 
                    1: { width: 230 },
                    2: { fontStyle: 'bold', halign: 'center', width: 70 },
                    3: { width: 130 }
                },
                body: [
                    [{ content: 'PERKARA' }, payload.tajuk.toUpperCase(), { content: 'TARIKH' }, tarikhDiformat],
                    [{ content: 'RUJ FAIL' }, payload.rujukan, { content: 'MASA' }, payload.masa.toUpperCase()],
                    [{ content: 'TEMPAT' }, payload.tempat.toUpperCase(), { content: 'ANJURAN' }, `UNIT ${payload.kategori} SKSR`],
                    [{ content: 'KEHADIRAN' }, { content: teksKehadiranDiformat.trim(), colSpan: 3, styles: { cellPadding: 6 } }],
                    [{ content: 'TIDAK HADIR' }, { content: payload.tidak_hadir, colSpan: 3, styles: { cellPadding: 6 } }]
                ]
            });

            // Pembinaan Susunan Kandungan Minit Mesyuarat (Table 2 - Isi Minit)
            let susunanBarisIsi = [
                [
                    { content: '1', styles: { halign: 'center' } }, 
                    { content: 'UCAPAN ALU-ALUAN PENGERUSI\n\n' + payload.perutusan_pengerusi }, 
                    { content: 'Pengerusi /\nMakluman', styles: { halign: 'center', valign: 'middle' } }
                ]
            ];

            // Melakukan pusingan (looping) untuk memasukkan agenda dinamik ke dalam jadual PDF
            payload.senarai_agenda.forEach((agenda, index) => {
                susunanBarisIsi.push([
                    { content: (index + 2).toString(), styles: { halign: 'center' } },
                    { content: agenda.sub_tajuk.toUpperCase() + '\n\n' + agenda.sub_isi },
                    { content: agenda.sub_tindakan, styles: { halign: 'center', valign: 'middle' } }
                ]);
            });

            // Memaparkan Jadual Kandungan Utama Minit
            doc.autoTable({
                startY: doc.lastAutoTable.finalY + 15,
                theme: 'plain',
                head: [['BIL.', 'PERKARA / ISU', 'TINDAKAN / MAKLUMAN']],
                headStyles: { fillColor: '#f2f2f2', fontStyle: 'bold', halign: 'center', textColor: 0, borderHexColor: '#000000', borderWidth: 1.5 },
                styles: { borderHexColor: '#000000', borderWidth: 1.5, lineColor: 0, cellPadding: 8, fontSize: 10, textColor: 0, valign: 'top' },
                columnStyles: {
                    0: { width: 40 },
                    1: { width: 330 },
                    2: { width: 150 }
                },
                body: susunanBarisIsi
            });

            // Penentuan Kedudukan Dan Ruang Tandatangan Urus Setia (Footer)
            let finalY = doc.lastAutoTable.finalY + 30;
            if (finalY > 730) { 
                doc.addPage(); 
                finalY = 50; 
            }

            doc.setFont("Helvetica", "normal");
            doc.setFontSize(10);
            doc.text("Disediakan oleh:", 50, finalY);
            
            // Garis Tandatangan Putus-Putus
            doc.setLineDashPattern([3, 3], 0);
            doc.line(50, finalY + 45, 250, finalY + 45);
            
            doc.setFont("Helvetica", "bold");
            doc.text(payload.setiausaha.toUpperCase(), 50, finalY + 60);
            doc.setFont("Helvetica", "normal");
            doc.text("Setiausaha Mesyuarat", 50, finalY + 72);
            doc.text("SK Simpang Rengam", 50, finalY + 84);

            // Simpan Dokumen Ke Komputer Pengguna Secara Automatik
            doc.save(`Minit_${payload.tajuk.replace(/\s+/g, '_')}.pdf`);
            alert("Berjaya disimpan! Fail PDF beserta Logo Rasmi Sekolah telah dimuat turun.");

            // =================================================================
            // RESET BORANG KEMBALI KEDADA ASAL SETELAH SELESAI JANA PDF
            // =================================================================
            document.getElementById('minitForm').reset();
            document.getElementById('agendaContainer').innerHTML = `
                <div class="agenda-item" data-index="0">
                    <div class="field">
                        <label class="label is-small">Tajuk Isu / Perkara / Agenda</label>
                        <input class="input is-small agenda-tajuk" placeholder="Contoh: Analisis Pencapaian Akademik Konten PIT1 2026" required>
                    </div>
                    <div class="columns">
                        <div class="column is-8">
                            <label class="label is-small">Perincian Isu / Kandungan Agenda</label>
                            <textarea class="textarea is-small agenda-isi" rows="3" placeholder="Nyatakan perkara yang dibincangkan serta keputusan mesyuarat..." required></textarea>
                        </div>
                        <div class="column is-4">
                            <label class="label is-small">Tindakan / Makluman Kepada</label>
                            <textarea class="textarea is-small agenda-tindakan" rows="3" placeholder="Contoh: Semua Guru / KP Mata Pelajaran" required></textarea>
                        </div>
                    </div>
                </div>
            `;
            senaraiGuruDipilih = [];
            counterAgenda = 1;
            renderTags();
        });
    </script>
</body>
</html>
