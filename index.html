<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Minit SK Simpang Rengam</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <style>
        :root { --primary-color: #1e3a8a; }
        body { background-color: #f4f7fa; padding: 20px; font-family: 'Segoe UI', sans-serif; }
        .form-container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); max-width: 850px; margin: 0 auto; }
        .form-header { text-align: center; margin-bottom: 25px; border-bottom: 2px solid #edf2f7; padding-bottom: 15px; }
        
        /* Pengurusan Kehadiran */
        .kehadiran-box { border: 1px solid #dbdbdb; border-radius: 4px; padding: 10px; min-height: 60px; background: #fff; margin-bottom: 10px; display: flex; flex-wrap: wrap; gap: 5px; }
        .teacher-tag { margin: 2px; }

        /* Kotak Agenda Dinamik */
        .agenda-item { background: #f9fafb; border: 1px solid #e5e7eb; padding: 15px; border-radius: 8px; margin-bottom: 15px; position: relative; }
        .btn-buang-agenda { position: absolute; top: 10px; right: 10px; }
    </style>
</head>
<body>
    <div class="form-container">
        <div class="form-header">
            <h1 class="title is-4" style="color: var(--primary-color);">SISTEM E-MINIT MESYUARAT</h1>
            <p class="subtitle is-6 has-text-grey">SK Simpang Rengam</p>
        </div>

        <form id="minitForm">
            <div class="columns">
                <div class="column is-4">
                    <div class="field">
                        <label class="label">Kategori Unit</label>
                        <div class="select is-fullwidth">
                            <select id="kategoriUnit" onchange="kemaskiniUnit()" required>
                                <option value="">-- Pilih Kategori --</option>
                                <option value="KURIKULUM">Kurikulum</option>
                                <option value="HEM">Hal Ehwal Murid</option>
                                <option value="KOKURIKULUM">Kokurikulum</option>
                                <option value="PENTADBIRAN">Pentadbiran</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="column is-8">
                    <div class="field">
                        <label class="label">Nama Unit / Panitia / Kelab</label>
                        <div class="select is-fullwidth">
                            <select id="namaUnitDetail" required>
                                <option value="">-- Sila Pilih Kategori Dahulu --</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <div class="columns">
                <div class="column is-8">
                    <div class="field">
                        <label class="label">Tajuk Penuh Mesyuarat</label>
                        <input class="input" id="tajuk" placeholder="Contoh: Mesyuarat Panitia Bahasa Melayu Bil 1/2026" required>
                    </div>
                </div>
                <div class="column is-4">
                    <div class="field">
                        <label class="label">Rujukan Fail</label>
                        <input class="input" id="rujukanFail" placeholder="Contoh: SKSR.600-2/1/1" required>
                    </div>
                </div>
            </div>

            <div class="columns">
                <div class="column">
                    <label class="label">Tarikh</label>
                    <input class="input" type="date" id="tarikh" required>
                </div>
                <div class="column">
                    <label class="label">Masa</label>
                    <input class="input" id="masa" placeholder="Contoh: 1:30 PM" required>
                </div>
                <div class="column">
                    <label class="label">Tempat / Platform</label>
                    <input class="input" id="tempat" placeholder="Contoh: Bilik Mesyuarat Aula Perdana" required>
                </div>
            </div>

            <div class="columns">
                <div class="column">
                    <div class="field">
                        <label class="label">Pengerusi Mesyuarat</label>
                        <input class="input" id="pengerusi" placeholder="Nama Pengerusi" required>
                    </div>
                </div>
                <div class="column">
                    <div class="field">
                        <label class="label">Disediakan Oleh (Setiausaha)</label>
                        <input class="input" id="setiausaha" placeholder="Nama Setiausaha" required>
                    </div>
                </div>
            </div>

            <div class="columns">
                <div class="column is-6">
                    <div class="field">
                        <label class="label">Kehadiran (Boleh Pilih Banyak)</label>
                        <div class="select is-fullwidth mb-2">
                            <select id="teacherSelect" onchange="tambahGuru()">
                                <option value="">-- Klik Untuk Pilih Kehadiran --</option>
                                <option value="GURU BESAR">Guru Besar</option>
                                <option value="GPK KURIKULUM">GPK Kurikulum</option>
                                <option value="GPK HEM">GPK HEM</option>
                                <option value="GPK KOKURIKULUM">GPK Kokurikulum</option>
                                <option value="GPK PETANG">GPK Petang</option>
                                <option value="SEMUA GURU">Semua Guru</option>
                                <option value="SILA RUJUK LAMPIRAN">Sila Rujuk Lampiran</option>
                            </select>
                        </div>
                        <div class="kehadiran-box" id="selectedTeachersBox">
                            <span class="has-text-grey-light subtitle is-7">Belum ada pilihan dibuat. Sila klik dropdown di atas.</span>
                        </div>
                    </div>
                </div>
                <div class="column is-6">
                    <div class="field">
                        <label class="label">Guru Tidak Hadir</label>
                        <textarea class="textarea" id="tidakHadir" rows="3" placeholder="Masukkan nama guru tidak hadir & alasan jika ada..."></textarea>
                    </div>
                </div>
            </div>

            <div class="field">
                <label class="label">1. Ucapan Alu-aluan Pengerusi</label>
                <textarea class="textarea" id="perutusan" rows="3" placeholder="Isi perutusan atau alu-aluan pengerusi..." required></textarea>
            </div>

            <div class="field mt-5">
                <div class="is-flex is-justify-content-space-between is-align-items-center mb-3">
                    <label class="label mb-0" style="color: var(--primary-color);">Perkara Baharu / Perbincangan Agenda & Tindakan</label>
                    <button type="button" class="button is-small is-success is-light" onclick="tambahKotakAgenda()">
                        <i class="fas fa-plus mr-1"></i> Tambah Agenda Baru
                    </button>
                </div>
                
                <div id="agendaContainer">
                    <div class="agenda-item" data-index="0">
                        <div class="field">
                            <label class="label is-small">Tajuk Isu / Perkara / Agenda</label>
                            <input class="input is-small agenda-tajuk" placeholder="Contoh: Analisis Pencapaian Akademik 2025" required>
                        </div>
                        <div class="columns">
                            <div class="column is-8">
                                <label class="label is-small">Perincian Isu / Kandungan Agenda</label>
                                <textarea class="textarea is-small agenda-isi" rows="3" placeholder="Nyatakan intipati perbincangan..." required></textarea>
                            </div>
                            <div class="column is-4">
                                <label class="label is-small">Tindakan / Makluman Kepada</label>
                                <textarea class="textarea is-small agenda-tindakan" rows="3" placeholder="Contoh: Semua guru / Panitia berkaitan" required></textarea>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <button type="submit" class="button is-link is-fullwidth is-large mt-5">
                <i class="fas fa-file-pdf mr-2"></i> SIMPAN & JANA PDF JADUAL
            </button>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCRJOiazrnB36Gfsr3chXsyuKN3W4Bw1EY",
            authDomain: "minit-mesyuarat-sksr.firebaseapp.com",
            projectId: "minit-mesyuarat-sksr",
            storageBucket: "minit-mesyuarat-sksr.firebasestorage.app",
            messagingSenderId: "89243689884",
            appId: "1:89243689884:web:f3b1ab7d263f4841915e59",
            measurementId: "G-01Q8992WC4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const dataUnit = {
            KURIKULUM: [
                "Pengurusan Kurikulum", "Panitia Bahasa Melayu", "Panitia Bahasa Inggeris", 
                "Panitia Matematik", "Panitia Sains", "Panitia Pendidikan Islam/Moral", 
                "Panitia Bahasa Arab", "Panitia Pendidikan Jasmani dan Kesihatan", 
                "Panitia Pendidikan Seni Visual", "Panitia Pendidikan Muzik"
            ],
            HEM: [
                "Pengurusan HEM", "Unit Disiplin & Pengawas", "Unit Bimbingan & Kaunseling", 
                "Unit Skim Pinjaman Buku Teks", "Unit Kantin", "Unit RMT", 
                "Unit Kesihatan dan Keselamatan", "Unit Kebajikan dan Bantuan", 
                "Unit APDM/IDME/Kehadiran Murid", "Unit Pendaftaran dan Penempatan", "Unit Lawatan"
            ],
            KOKURIKULUM: ["Pengurusan Kokurikulum"],
            PENTADBIRAN: ["Mesyuarat Guru & Staf", "Mesyuarat Kewangan", "Mesyuarat JK Pengurusan"]
        };

        window.kemaskiniUnit = () => {
            const kat = document.getElementById('kategoriUnit').value;
            const det = document.getElementById('namaUnitDetail');
            det.innerHTML = '<option value="">-- Pilih Unit --</option>';
            if(dataUnit[kat]) dataUnit[kat].forEach(u => { det.innerHTML += `<option value="${u}">${u}</option>`; });
        };

        document.getElementById('namaUnitDetail').addEventListener('change', function() {
            if(this.value) document.getElementById('tajuk').value = `Mesyuarat ${this.value} Bil 1/2026`;
        });

        // MULTIPLE SELECT DRIVEN BY TAGS
        let senaraiGuruDipilih = [];
        window.tambahGuru = () => {
            const selectEl = document.getElementById('teacherSelect');
            if(!selectEl.value) return;
            if(!senaraiGuruDipilih.includes(selectEl.value)) {
                senaraiGuruDipilih.push(selectEl.value);
                renderTags();
            }
            selectEl.value = ""; // Kembalikan dropdown ke posisi default untuk pilihan seterusnya
        };
        window.padamGuru = (nama) => {
            senaraiGuruDipilih = senaraiGuruDipilih.filter(g => g !== nama);
            renderTags();
        };
        function renderTags() {
            const container = document.getElementById('selectedTeachersBox');
            container.innerHTML = senaraiGuruDipilih.length === 0 ? `<span class="has-text-grey-light subtitle is-7">Belum ada pilihan dibuat. Sila klik dropdown di atas.</span>` : "";
            senaraiGuruDipilih.forEach(guru => {
                container.innerHTML += `<span class="tag is-info is-light teacher-tag">${guru}<button type="button" class="delete is-small" onclick="padamGuru('${guru}')"></button></span>`;
            });
        }

        // FUNGSI AGENDA DINAMIK
        let counterAgenda = 1;
        window.tambahKotakAgenda = () => {
            const container = document.getElementById('agendaContainer');
            const htmlAgendaBaru = `
                <div class="agenda-item" data-index="${counterAgenda}">
                    <button type="button" class="button is-small is-danger is-light btn-buang-agenda" onclick="buangKotakAgenda(${counterAgenda})">
                        <i class="fas fa-trash"></i>
                    </button>
                    <div class="field">
                        <label class="label is-small">Tajuk Isu / Perkara / Agenda</label>
                        <input class="input is-small agenda-tajuk" placeholder="Contoh: Perbincangan Aktiviti Sampingan" required>
                    </div>
                    <div class="columns">
                        <div class="column is-8">
                            <label class="label is-small">Perincian Isu / Kandungan Agenda</label>
                            <textarea class="textarea is-small agenda-isi" rows="3" placeholder="Nyatakan intipati perbincangan..." required></textarea>
                        </div>
                        <div class="column is-4">
                            <label class="label is-small">Tindakan / Makluman Kepada</label>
                            <textarea class="textarea is-small agenda-tindakan" rows="3" placeholder="Contoh: Makluman semua guru" required></textarea>
                        </div>
                    </div>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', htmlAgendaBaru);
            counterAgenda++;
        };

        window.buangKotakAgenda = (index) => {
            const item = document.querySelector(`.agenda-item[data-index="${index}"]`);
            if(item) item.remove();
        };

        // SUBMIT & PROSES PDF
        document.getElementById('minitForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if(senaraiGuruDipilih.length === 0) { alert("Sila tentukan maklumat kehadiran terlebih dahulu."); return; }

            const agendaItems = document.querySelectorAll('.agenda-item');
            let senaraiAgendaPayload = [];
            agendaItems.forEach(item => {
                senaraiAgendaPayload.push({
                    sub_tajuk: item.querySelector('.agenda-tajuk').value,
                    sub_isi: item.querySelector('.agenda-isi').value,
                    sub_tindakan: item.querySelector('.agenda-tindakan').value
                });
            });

            const guruTidakHadirTeks = document.getElementById('tidakHadir').value || "Tiada / Penuh";

            const payload = {
                kategori: document.getElementById('kategoriUnit').value,
                unit: document.getElementById('namaUnitDetail').value,
                tajuk: document.getElementById('tajuk').value,
                rujukan: document.getElementById('rujukanFail').value || "Tiada Rujukan",
                tarikh: document.getElementById('tarikh').value,
                masa: document.getElementById('masa').value,
                tempat: document.getElementById('tempat').value,
                pengerusi: document.getElementById('pengerusi').value,
                setiausaha: document.getElementById('setiausaha').value,
                kehadiran: senaraiGuruDipilih,
                tidak_hadir: guruTidakHadirTeks,
                perutusan_pengerusi: document.getElementById('perutusan').value,
                senarai_agenda: senaraiAgendaPayload,
                tarikh_diisi: new Date().toISOString()
            };

            try { await addDoc(collection(db, "minit_mesyuarat"), payload); } catch (err) { console.error("Ralat Firebase:", err); }

            // PENJANAAN PDF FORMAT MULTI-PAGE KPM
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('p', 'pt', 'a4');

            doc.setFont("Helvetica", "bold");
            doc.setFontSize(14);
            doc.text("MINIT MESYUARAT SESI PERSEKOLAHAN 2026", 297, 45, { align: "center" });
            doc.text("SK SIMPANG RENGAM", 297, 65, { align: "center" });

            let teksKehadiranDiformat = "";
            payload.kehadiran.forEach((g, idx) => { teksKehadiranDiformat += `${idx + 1}. ${g}\n`; });
            
            const tarikhDiformat = payload.tarikh.split('-').reverse().join('/');

            doc.autoTable({
                startY: 85,
                theme: 'plain',
                styles: { borderHexColor: '#000000', borderWidth: 1.5, lineColor: 0, cellPadding: 6, fontSize: 10, textColor: 0 },
                columnStyles: { 
                    0: { fontStyle: 'bold', halign: 'center', width: 90 }, 
                    1: { width: 230 },
                    2: { fontStyle: 'bold', halign: 'center', width: 70 },
                    3: { width: 130 }
                },
                body: [
                    [{ content: 'PERKARA' }, payload.tajuk.toUpperCase(), { content: 'TARIKH' }, tarikhDiformat],
                    [{ content: 'RUJ FAIL' }, payload.rujukan, { content: 'MASA' }, payload.masa.toUpperCase()],
                    [{ content: 'TEMPAT' }, payload.tempat.toUpperCase(), { content: 'ANJURAN' }, `UNIT ${payload.kategori} SKSR`],
                    [{ content: 'KEHADIRAN' }, { content: teksKehadiranDiformat.trim(), colSpan: 3, styles: { cellPadding: 6 } }],
                    [{ content: 'TIDAK HADIR' }, { content: payload.tidak_hadir, colSpan: 3, styles: { cellPadding: 6 } }]
                ]
            });

            let susunanBarisIsi = [
                [
                    { content: '1', styles: { halign: 'center' } }, 
                    { content: 'UCAPAN ALU-ALUAN PENGERUSI\n\n' + payload.perutusan_pengerusi }, 
                    { content: 'Pengerusi /\nMakluman', styles: { halign: 'center', valign: 'middle' } }
                ]
            ];

            payload.senarai_agenda.forEach((agenda, index) => {
                susunanBarisIsi.push([
                    { content: (index + 2).toString(), styles: { halign: 'center' } },
                    { content: agenda.sub_tajuk.toUpperCase() + '\n\n' + agenda.sub_isi },
                    { content: agenda.sub_tindakan, styles: { halign: 'center', valign: 'middle' } }
                ]);
            });

            doc.autoTable({
                startY: doc.lastAutoTable.finalY + 15,
                theme: 'plain',
                head: [['BIL.', 'PERKARA / ISU', 'TINDAKAN / MAKLUMAN']],
                headStyles: { fillColor: '#f2f2f2', fontStyle: 'bold', halign: 'center', textColor: 0, borderHexColor: '#000000', borderWidth: 1.5 },
                styles: { borderHexColor: '#000000', borderWidth: 1.5, lineColor: 0, cellPadding: 8, fontSize: 10, textColor: 0, valign: 'top' },
                columnStyles: {
                    0: { width: 40 },
                    1: { width: 330 },
                    2: { width: 150 }
                },
                body: susunanBarisIsi
            });

            let finalY = doc.lastAutoTable.finalY + 30;
            if (finalY > 730) { 
                doc.addPage(); 
                finalY = 50; 
            }

            doc.setFont("Helvetica", "normal");
            doc.setFontSize(10);
            doc.text("Disediakan oleh:", 50, finalY);
            
            doc.setLineDashPattern([3, 3], 0);
            doc.line(50, finalY + 45, 250, finalY + 45);
            
            doc.setFont("Helvetica", "bold");
            doc.text(payload.setiausaha.toUpperCase(), 50, finalY + 60);
            doc.setFont("Helvetica", "normal");
            doc.text("Setiausaha Mesyuarat", 50, finalY + 72);
            doc.text("SK Simpang Rengam", 50, finalY + 84);

            doc.save(`Minit_${payload.tajuk.replace(/\s+/g, '_')}.pdf`);
            alert("Berjaya disimpan! Fail PDF jadual minit mesyuarat telah dimuat turun.");

            // Reset Borang
            document.getElementById('minitForm').reset();
            document.getElementById('agendaContainer').innerHTML = `
                <div class="agenda-item" data-index="0">
                    <div class="field">
                        <label class="label is-small">Tajuk Isu / Perkara / Agenda</label>
                        <input class="input is-small agenda-tajuk" placeholder="Contoh: Analisis Pencapaian Akademik 2025" required>
                    </div>
                    <div class="columns">
                        <div class="column is-8">
                            <label class="label is-small">Perincian Isu / Kandungan Agenda</label>
                            <textarea class="textarea is-small agenda-isi" rows="3" placeholder="Nyatakan intipati perbincangan..." required></textarea>
                        </div>
                        <div class="column is-4">
                            <label class="label is-small">Tindakan / Makluman Kepada</label>
                            <textarea class="textarea is-small agenda-tindakan" rows="3" placeholder="Contoh: Semua guru / Panitia berkaitan" required></textarea>
                        </div>
                    </div>
                </div>
            `;
            senaraiGuruDipilih = [];
            counterAgenda = 1;
            renderTags();
        });
    </script>
</body>
</html>
