<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>e-Minit Mesyuarat SK Simpang Rengam</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <style>
        :root { --primary-color: #1e3a8a; }
        body { background-color: #f4f7fa; padding: 20px; font-family: 'Segoe UI', sans-serif; }
        .dashboard-container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); max-width: 1000px; margin: 0 auto; }
        .form-header { display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 25px; border-bottom: 2px solid #edf2f7; padding-bottom: 15px; }
        .form-logo { width: 70px; height: auto; flex-shrink: 0; }
        .form-title-area { text-align: left; }
        .tab-aktif { background-color: var(--primary-color) !important; color: white !important; }
        .hidden-logo { display: none; }
    </style>
</head>
<body>
    <img src="logo_sksr.png" id="logoSekolah" class="hidden-logo" alt="Logo SKSR">

    <div class="dashboard-container">
        <div class="form-header">
            <img src="logo_sksr.png" class="form-logo" alt="Logo SK Simpang Rengam">
            <div class="form-title-area">
                <div style="font-size: 1.5rem; font-weight: 700; color: var(--primary-color); line-height: 1.2;">
                    e-MINIT MESYUARAT SK SIMPANG RENGAM
                </div>
                <div style="font-size: 1rem; color: #4a4a4a; margin-top: 4px;">
                    SK Simpang Rengam
                </div>
            </div>
        </div>

        <div class="tabs is-toggle is-fullwidth mb-5">
            <ul>
                <li id="tab-SEMUA" class="is-active"><a onclick="tapisKategori('SEMUA')"><i class="fas fa-list mr-2"></i>Semua</a></li>
                <li id="tab-KURIKULUM"><a onclick="tapisKategori('KURIKULUM')"><i class="fas fa-book mr-2"></i>Kurikulum</a></li>
                <li id="tab-HEM"><a onclick="tapisKategori('HEM')"><i class="fas fa-user-graduate mr-2"></i>HEM</a></li>
                <li id="tab-KOKURIKULUM"><a onclick="tapisKategori('KOKURIKULUM')"><i class="fas fa-trophy mr-2"></i>Kokurikulum</a></li>
                <li id="tab-PENTADBIRAN"><a onclick="tapisKategori('PENTADBIRAN')"><i class="fas fa-users-cog mr-2"></i>Pentadbiran</a></li>
            </ul>
        </div>

        <div class="field mb-5">
            <p class="control has-icons-left">
                <input class="input" type="text" id="kataKunciCarian" placeholder="Cari mengikut nama panitia, unit, tajuk atau pengerusi..." oninput="tapisTeks()">
                <span class="icon is-small is-left">
                    <i class="fas fa-search"></i>
                </span>
            </p>
        </div>

        <div class="table-container">
            <table class="table is-striped is-hoverable is-fullwidth">
                <thead>
                    <tr>
                        <th>Tarikh</th>
                        <th>Kategori</th>
                        <th>Nama Unit / Mesyuarat</th>
                        <th>Pengerusi</th>
                        <th class="has-text-center">Tindakan</th>
                    </tr>
                </thead>
                <tbody id="senaraiMinitTbody">
                    <tr>
                        <td colspan="5" class="has-text-centered has-text-grey py-5">
                            <i class="fas fa-spinner fa-spin mr-2"></i> Memuat turun senarai minit mesyuarat...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Konfigurasi Firebase (Sama seperti fail utama anda)
        const firebaseConfig = {
            apiKey: "AIzaSyCRJOiazrnB36Gfsr3chXsyuKN3W4Bw1EY",
            authDomain: "minit-mesyuarat-sksr.firebaseapp.com",
            projectId: "minit-mesyuarat-sksr",
            storageBucket: "minit-mesyuarat-sksr.firebasestorage.app",
            messagingSenderId: "89243689884",
            appId: "1:89243689884:web:f3b1ab7d263f4841915e59",
            measurementId: "G-01Q8992WC4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let semuaDataMinit = [];
        let kategoriSemasa = "SEMUA";

        // Ambil data daripada Firebase Firestore sewaktu halaman dibuka
        async function muatDataMinit() {
            try {
                const q = query(collection(db, "minit_mesyuarat"), orderBy("tarikh", "desc"));
                const querySnapshot = await getDocs(q);
                semuaDataMinit = [];
                
                querySnapshot.forEach((doc) => {
                    semuaDataMinit.push({ id: doc.id, ...doc.data() });
                });
                
                binaJadualPaparan(semuaDataMinit);
            } catch (err) {
                console.error("Ralat memuat data:", err);
                document.getElementById('senaraiMinitTbody').innerHTML = `<tr><td colspan="5" class="has-text-centered has-text-danger">Gagal memuat data pangkalan data Firebase.</td></tr>`;
            }
        }

        function binaJadualPaparan(data) {
            const tbody = document.getElementById('senaraiMinitTbody');
            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="has-text-centered has-text-grey py-4">Tiada rekod minit mesyuarat ditemui.</td></tr>`;
                return;
            }

            tbody.innerHTML = "";
            data.forEach((minit, index) => {
                const tarikhDiformat = minit.tarikh.split('-').reverse().join('/');
                const row = document.createElement('tr');
                
                row.innerHTML = `
                    <td><strong>${tarikhDiformat}</strong></td>
                    <td><span class="tag is-light is-info">${minit.kategori}</span></td>
                    <td>
                        <span class="is-block font-weight-bold" style="color:#1e3a8a; font-weight:600;">${minit.unit}</span>
                        <small class="has-text-grey">${minit.tajuk}</small>
                    </td>
                    <td>${minit.pengerusi}</td>
                    <td class="has-text-centered">
                        <button class="button is-small is-link is-outlined btn-download" data-id="${index}">
                            <i class="fas fa-file-pdf mr-1"></i> Buka PDF
                        </button>
                    </td>
                `;
                tbody.appendChild(row);
            });

            // Set event listener untuk butang muat turun dinamik
            document.querySelectorAll('.btn-download').forEach(btn => {
                btn.addEventListener('click', function() {
                    const idx = this.getAttribute('data-id');
                    janaPdfMinit(data[idx]);
                });
            });
        }

        // Fungsi Tapis Mengikut Kategori Menu Tab
        window.tapisKategori = (kat) => {
            kategoriSemasa = kat;
            document.querySelectorAll('.tabs li').forEach(li => li.classList.remove('is-active'));
            document.getElementById(`tab-${kat}`).classList.add('is-active');
            laksanaPenapisanPenuh();
        };

        // Fungsi Tapis Mengikut Input Kotak Carian Teks
        window.tapisTeks = () => {
            laksanaPenapisanPenuh();
        };

        function laksanaPenapisanPenuh() {
            const kataKunci = document.getElementById('kataKunciCarian').value.toLowerCase();
            
            let hasilTapis = semuaDataMinit;

            if (kategoriSemasa !== "SEMUA") {
                hasilTapis = hasilTapis.filter(m => m.kategori === kategoriSemasa);
            }

            if (kataKunci.trim() !== "") {
                hasilTapis = hasilTapis.filter(m => 
                    m.unit.toLowerCase().includes(kataKunci) || 
                    m.tajuk.toLowerCase().includes(kataKunci) || 
                    m.pengerusi.toLowerCase().includes(kataKunci)
                );
            }

            binaJadualPaparan(hasilTapis);
        }

        // =================================================================
        // LOGIK UTAMA: JANA SEMULA FAIL PDF MENGIKUT DATA YANG DIPILIH
        // =================================================================
        function janaPdfMinit(payload) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('p', 'pt', 'a4');
            let startTableY = 165;

            const logoImg = document.getElementById('logoSekolah');
            if (logoImg) {
                try {
                    doc.addImage(logoImg, 'PNG', 262.5, 20, 70, 70);
                } catch (err) {
                    console.error("Suntikan logo gagal:", err);
                }
            }

            doc.setFont("Helvetica", "bold");
            doc.setFontSize(13);
            doc.text("MINIT MESYUARAT SESI PERSEKOLAHAN 2026", 297, startTableY - 50, { align: "center" });
            doc.text("SK SIMPANG RENGAM", 297, startTableY - 32, { align: "center" });

            let teksKehadiranDiformat = "";
            payload.kehadiran.forEach((g, idx) => { teksKehadiranDiformat += `${idx + 1}. ${g}\n`; });
            const tarikhDiformat = payload.tarikh.split('-').reverse().join('/');

            doc.autoTable({
                startY: startTableY,
                theme: 'plain',
                styles: { borderHexColor: '#000000', borderWidth: 1.5, lineColor: 0, cellPadding: 6, fontSize: 10, textColor: 0 },
                columnStyles: { 
                    0: { fontStyle: 'bold', halign: 'center', width: 90 }, 
                    1: { width: 230 },
                    2: { fontStyle: 'bold', halign: 'center', width: 70 },
                    3: { width: 130 }
                },
                body: [
                    [{ content: 'PERKARA' }, payload.tajuk.toUpperCase(), { content: 'TARIKH' }, tarikhDiformat],
                    [{ content: 'RUJ FAIL' }, payload.rujukan, { content: 'MASA' }, payload.masa.toUpperCase()],
                    [{ content: 'TEMPAT' }, payload.tempat.toUpperCase(), { content: 'ANJURAN' }, `UNIT ${payload.kategori} SKSR`],
                    [{ content: 'KEHADIRAN' }, { content: teksKehadiranDiformat.trim(), colSpan: 3, styles: { cellPadding: 6 } }],
                    [{ content: 'TIDAK HADIR' }, { content: payload.tidak_hadir, colSpan: 3, styles: { cellPadding: 6 } }]
                ]
            });

            let susunanBarisIsi = [
                [
                    { content: '1', styles: { halign: 'center' } }, 
                    { content: 'UCAPAN ALU-ALUAN PENGERUSI\n\n' + payload.perutusan_pengerusi }, 
                    { content: 'Pengerusi /\nMakluman', styles: { halign: 'center', valign: 'middle' } }
                ]
            ];

            payload.senarai_agenda.forEach((agenda, index) => {
                susunanBarisIsi.push([
                    { content: (index + 2).toString(), styles: { halign: 'center' } },
                    { content: agenda.sub_tajuk.toUpperCase() + '\n\n' + agenda.sub_isi },
                    { content: agenda.sub_tindakan, styles: { halign: 'center', valign: 'middle' } }
                ]);
            });

            doc.autoTable({
                startY: doc.lastAutoTable.finalY + 15,
                theme: 'plain',
                head: [['BIL.', 'PERKARA / ISU', 'TINDAKAN / MAKLUMAN']],
                headStyles: { fillColor: '#f2f2f2', fontStyle: 'bold', halign: 'center', textColor: 0, borderHexColor: '#000000', borderWidth: 1.5 },
                styles: { borderHexColor: '#000000', borderWidth: 1.5, lineColor: 0, cellPadding: 8, fontSize: 10, textColor: 0, valign: 'top' },
                columnStyles: { 0: { width: 40 }, 1: { width: 330 }, 2: { width: 150 } },
                body: susunanBarisIsi
            });

            let finalY = doc.lastAutoTable.finalY + 30;
            if (finalY > 730) { doc.addPage(); finalY = 50; }

            doc.setFont("Helvetica", "normal"); doc.setFontSize(10);
            doc.text("Disediakan oleh:", 50, finalY);
            doc.setLineDashPattern([3, 3], 0); doc.line(50, finalY + 45, 250, finalY + 45);
            doc.setFont("Helvetica", "bold"); doc.text(payload.setiausaha.toUpperCase(), 50, finalY + 60);
            doc.setFont("Helvetica", "normal"); doc.text("Setiausaha Mesyuarat", 50, finalY + 72);
            doc.text("SK Simpang Rengam", 50, finalY + 84);

            doc.save(`Minit_${payload.tajuk.replace(/\s+/g, '_')}.pdf`);
        }

        // Jalankan fungsi sebaik sahaja script ini dimuatkan
        muatDataMinit();
    </script>
</body>
</html>
